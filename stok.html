<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informasi Stok Bahan Ajar - SITTA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="stokApp" style="max-width: 900px; margin: 30px auto; padding: 20px; font-family: Arial, sans-serif;">
        <a href="index.html" style="color: #003366; text-decoration: none; font-weight: bold;">&larr; Kembali ke Beranda</a>
        <h2 style="color: #003366; margin-top: 15px;">Manajemen Stok Bahan Ajar</h2>
        
        <!-- Input Pencarian (Directive v-model) -->
        <div style="margin-bottom: 20px;">
            <input type="text" v-model="cariKode" placeholder="Cari berdasarkan kode atau nama BMP..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <!-- Tabel Data Stok -->
        <table border="1" cellpadding="10" cellspacing="0" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr style="background-color: #003366; color: white;">
                    <th>Kode BMP</th>
                    <th>Judul BMP</th>
                    <th>Kategori</th>
                    <th>Stok</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="item in filteredStok">
                    <td>{{ item.kode }}</td>
                    <td>{{ item.judul }}</td>
                    <td>{{ item.kategori }}</td>
                    <td>{{ item.stok }}</td>
                    <td>
                        <!-- Conditional Directive v-if / v-else -->
                        <span v-if="item.stok > 10" style="color: green; font-weight: bold;">Aman</span>
                        <span v-else style="color: red; font-weight: bold;">Menipis</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

  <!-- 1. Panggil dulu Library Vue 2 -->
<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

<!-- 2. Panggil file database data dummy -->
<script src="js/databahanajar.js"></script>

<!-- 3. Panggil file logika Vue khusus halaman stok -->
<script src="js/stok-app.js"></script>
</body>
</html>
