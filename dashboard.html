<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SITTA Universitas Terbuka</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background-color: #f4f6f9;">

    <!-- Sidebar / Navigasi Atas -->
    <header style="background-color: #003366; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0; font-size: 1.2rem;">SITTA UT - Dashboard</h2>
        <nav>
            <a href="dashboard.html" style="color: white; text-decoration: none; margin-right: 20px; font-weight: bold;">Dashboard</a>
            <a href="stok.html" style="color: #ffcc00; text-decoration: none; margin-right: 20px;">Stok Bahan Ajar</a>
            <a href="tracking.html" style="color: #ffcc00; text-decoration: none; margin-right: 20px;">Tracking</a>
            <a href="index.html" id="btnLogout" style="color: #ff4d4d; text-decoration: none; font-weight: bold;">Logout</a>
        </nav>
    </header>

    <!-- Konten Utama Dashboard -->
    <main style="padding: 30px; max-width: 1200px; margin: 0 auto;">
        <div style="background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px;">
            <h3 style="color: #003366; margin-top: 0;">Selamat Datang di Sistem Informasi Bahan Ajar (SITTA)</h3>
            <p style="color: #555;">Gunakan menu di atas atau pintasan di bawah untuk mengelola data bahan ajar dan memantau status pengiriman.</p>
        </div>

        <!-- Kotak Ringkasan / Cards -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
            <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #003366;">
                <h4 style="margin: 0 0 10px 0; color: #333;">Total Bahan Ajar</h4>
                <p id="totalBahanAjar" style="font-size: 1.5rem; font-weight: bold; margin: 0; color: #003366;">Memuat...</p>
            </div>
            <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #ffcc00;">
                <h4 style="margin: 0 0 10px 0; color: #333;">Status Pengiriman</h4>
                <p style="font-size: 1.2rem; font-weight: bold; margin: 0; color: #333;">Aktif / Diproses</p>
            </div>
        </div>
    </main>

    <!-- Pemanggilan File JavaScript Pendukung -->
    <script src="js/data.js"></script>
    <script src="js/databahanajar.js"></script>
    <script src="js/script.js"></script>
    <script src="js/stok-app.js"></script>
    <script src="js/tracking-app.js"></script>
</body>
</html>
