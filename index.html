<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SITTA Universitas Terbuka</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div class="card" style="width: 380px;">
        <h2 style="text-align: center;">SITTA UT</h2>
        <p style="text-align: center; margin-bottom: 20px; color: #666;">Sistem Informasi Bahan Ajar</p>
        
        <form id="formLogin">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Contoh: admin@ut.ac.id" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" style="width: 100%;">Login</button>
        </form>

        <div id="alertBox" class="alert hidden"></div>

        <div style="display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.9rem;">
            <a href="#" id="btnLupa" style="color: #003366;">Lupa Password?</a>
            <a href="#" id="btnDaftar" style="color: #003366;">Belum punya akun?</a>
        </div>
    </div>

    <!-- Modal Pop-up -->
    <div id="modalBox" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h3 id="modalTitle" style="color: #003366; margin-bottom: 15px;">Informasi</h3>
            <p id="modalText">Isi pesan modal...</p>
        </div>
    </div>

    <script src="JS/Data.js"></script>
<script src="JS/script.js"></script>
</body>
</html>
