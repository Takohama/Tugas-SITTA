<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITTA - Universitas Terbuka</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app" style="max-width: 500px; margin: 40px auto; padding: 25px; font-family: Arial, sans-serif; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        
        <!-- BAGIAN 1: ELEMEN FORM LOGIN (Tampil jika belum login) -->
        <div v-if="!isLoggedIn">
            <h2 style="color: #003366; text-align: center; margin-bottom: 5px;">SITTA UT</h2>
            <p style="text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 25px;">Sistem Informasi Bahan Ajar</p>
            
            <form @submit.prevent="handleLogin">
                <div style="margin-bottom: 15px;">
                    <label for="email" style="display: block; font-weight: bold; font-size: 0.9rem; margin-bottom: 5px;">Email:</label>
                    <input type="email" id="email" v-model="email" placeholder="mahasiswa@ut.ac.id" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label for="password" style="display: block; font-weight: bold; font-size: 0.9rem; margin-bottom: 5px;">Password:</label>
                    <input type="password" id="password" v-model="password" placeholder="mahasiswa@12345" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                </div>
                
                <button type="submit" style="width: 100%; padding: 10px; background-color: #ffcc00; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #333;">Login</button>
            </form>
        </div>

        <!-- BAGIAN 2: ELEMEN MENU UTAMA / NAVIGASI (Tampil setelah login sukses) -->
        <div v-else>
            <h2 style="color: #003366; text-align: center;">Sistem Informasi Bahan Ajar (SITTA)</h2>
            <p style="text-align: center; color: #666;">Universitas Terbuka</p>
            <p style="text-align: center; font-size: 0.9rem; color: #333;">Login sebagai: <b>{{ currentUser }}</b></p>
            
            <!-- Navigasi Menu ke Halaman Lain -->
            <div style="display: flex; flex-direction: column; gap: 12px; margin: 30px 0;">
                <a href="stok.html" style="padding: 12px; background: #003366; color: white; text-decoration: none; text-align: center; border-radius: 4px; font-weight: bold;">Halaman Stok Bahan Ajar</a>
                <a href="tracking.html" style="padding: 12px; background: #ffcc00; color: #333; text-decoration: none; text-align: center; border-radius: 4px; font-weight: bold;">Halaman Tracking DO</a>
            </div>

            <!-- Tombol Keluar/Logout -->
            <button @click="handleLogout" style="width: 100%; padding: 10px; background-color: #d9534f; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Logout / Keluar</button>
        </div>

    </div>

    <!-- Script Vue 2 dan Logika Sesi -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script>
        new Vue({
            el: '#app',
            data: {
                email: '',
                password: '',
                isLoggedIn: false,
                currentUser: ''
            },
            created() {
                if (localStorage.getItem("sitta_logged_in") === "true") {
                    this.isLoggedIn = true;
                    this.currentUser = localStorage.getItem("sitta_user");
                }
            },
            methods: {
                handleLogin() {
                    if (this.email.trim() === "mahasiswa@ut.ac.id" && this.password.trim() === "mahasiswa@12345") {
                        localStorage.setItem("sitta_logged_in", "true");
                        localStorage.setItem("sitta_user", this.email);
                        this.isLoggedIn = true;
                        this.currentUser = this.email;
                        alert("Login Berhasil!");
                    } else {
                        alert("Email atau Password salah! Gunakan: mahasiswa@ut.ac.id & mahasiswa@12345");
                    }
                },
                handleLogout() {
                    localStorage.removeItem("sitta_logged_in");
                    localStorage.removeItem("sitta_user");
                    this.isLoggedIn = false;
                    this.email = '';
                    this.password = '';
                }
            }
        });
    </script>
</body>
</html>
