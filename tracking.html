<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Delivery Order - SITTA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="trackingApp" style="max-width: 800px; margin: 30px auto; padding: 20px; font-family: Arial, sans-serif;">
        <a href="index.html" style="color: #003366; text-decoration: none; font-weight: bold;">&larr; Kembali ke Beranda</a>
        <h2 style="color: #003366; margin-top: 15px;">Tracking Delivery Order (DO)</h2>
        
        <div style="margin-bottom: 20px;">
            <input type="text" v-model="nomorDO" placeholder="Masukkan Nomor DO (Contoh: DO-001)..." style="width: 70%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            <button @click="cariTracking" style="padding: 10px 20px; background: #003366; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Cek Status</button>
        </div>

        <!-- Conditional v-if untuk menampilkan hasil tracking -->
        <div v-if="hasilPencarian" style="background: #f4f6f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
            <p><strong>Nomor DO:</strong> {{ hasilPencarian.do }}</p>
            <p><strong>Penerima:</strong> {{ hasilPencarian.nama }} (NIM: {{ hasilPencarian.nim }})</p>
            <p><strong>Ekspedisi:</strong> {{ hasilPencarian.ekspedisi }}</p>
            <p><strong>Status Pengiriman:</strong> <span style="color: #0026AD; font-weight: bold;">{{ hasilPencarian.status }}</span></p>
        </div>
        <div v-else-if="pencarianDilakukan" style="color: red;">
            Data Delivery Order tidak ditemukan.
        </div>
    </div>

    <!-- Panggil Vue 2 dan File Logika Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="js/databahanajar.js"></script>
    <script src="js/tracking-app.js"></script>
</body>
</html>
